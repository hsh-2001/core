name: deploy worker

on:
    push:
        branches:
        - production

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'
            - name: Install dependencies
              run: npm ci
            
            - name: Build the project
              run: npm run build
            
            - name: Deploy to Cloudflare Workers
              env:
                CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
              run: npm run deploy

              
            